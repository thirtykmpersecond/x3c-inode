name: build-release

# 打 v 开头的标签(如 v1.1.0)即自动四平台编译并发布 Release(含 OpenWrt ARMv7 静态版);
# 标签带预发行后缀(含'-', 如 v1.2.0-rc.1 / v2.0.0-beta.1)则标记为 prerelease;
# 也可在 Actions 页面手动 Run workflow(只产出构建产物, 不发 Release)。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04          # 老 glibc, 提高二进制发行兼容性
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev build-essential
      - name: 编译
        working-directory: reimpl
        run: |
          make
          mkdir -p ../dist
          cp x3c8021x-re ../dist/x3c8021x-re-linux-x86_64
      - name: 校验
        run: |
          file dist/x3c8021x-re-linux-x86_64
          ldd dist/x3c8021x-re-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: x3c8021x-re-linux-x86_64
          path: dist/x3c8021x-re-linux-x86_64

  build-windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 安装 MinGW 交叉工具链
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 unzip
      - name: 获取 Npcap SDK
        run: |
          curl -fsSL -o /tmp/npcap-sdk.zip https://npcap.com/dist/npcap-sdk-1.13.zip
          unzip -q /tmp/npcap-sdk.zip -d /tmp/npcap-sdk
      - name: 交叉编译
        working-directory: reimpl
        run: |
          make CC=x86_64-w64-mingw32-gcc \
               CFLAGS="-O2 -Wall -Wextra -I/tmp/npcap-sdk/Include" \
               LIBS="-L/tmp/npcap-sdk/Lib/x64 -lwpcap -liphlpapi -lws2_32"
          mkdir -p ../dist
          cp x3c8021x-re.exe ../dist/x3c8021x-re-win64.exe
      - name: 校验
        run: file dist/x3c8021x-re-win64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: x3c8021x-re-win64
          path: dist/x3c8021x-re-win64.exe

  build-macos:
    runs-on: macos-14             # arm64 runner, 用 -arch 同时产出 arm64+x86_64
    steps:
      - uses: actions/checkout@v4
      - name: 编译(通用二进制)
        working-directory: reimpl
        run: |
          make CFLAGS="-O2 -Wall -Wextra -arch arm64 -arch x86_64"
          mkdir -p ../dist
          cp x3c8021x-re ../dist/x3c8021x-re-macos-universal
      - name: 校验
        run: |
          file dist/x3c8021x-re-macos-universal
          lipo -info dist/x3c8021x-re-macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: x3c8021x-re-macos-universal
          path: dist/x3c8021x-re-macos-universal

  build-openwrt-armv7:
    runs-on: ubuntu-22.04
    # OpenWrt 官方 SDK 自带 musl 交叉工具链, 产出全静态 ARMv7(硬浮点
    # EABIhf)二进制, 可直接跑在 ipq40xx/mvebu/sunxi/armsr 等 armv7 目标,
    # 不依赖目标机的 libpcap/musl 版本
    env:
      SDK_URL: https://downloads.openwrt.org/releases/25.12.6/targets/armsr/armv7/openwrt-sdk-25.12.6-armsr-armv7_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: sudo apt-get update && sudo apt-get install -y flex bison zstd
      - name: 获取 OpenWrt SDK(官方 musl 工具链)
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/sdk.tar.zst "$SDK_URL"
          tar --zstd -xf /tmp/sdk.tar.zst -C /tmp
          TC_DIR="$(dirname "$(echo /tmp/openwrt-sdk-*/staging_dir/toolchain-*/bin/arm-openwrt-linux-*-gcc | head -1)")"
          echo "$TC_DIR" >> "$GITHUB_PATH"
          echo "CC=$(echo "$TC_DIR"/arm-openwrt-linux-*-gcc | head -1)" >> "$GITHUB_ENV"
          "$CC" --version | head -1
      - name: 交叉编译静态 libpcap
        run: |
          curl -fsSLO https://www.tcpdump.org/release/libpcap-1.10.4.tar.gz
          tar xf libpcap-1.10.4.tar.gz
          cd libpcap-1.10.4
          HOST="$(basename "$CC" | sed 's/-gcc$//')"
          CC="$CC" CFLAGS="-Os" ./configure --host="$HOST" --disable-shared
          make -j2
      - name: 编译客户端(全静态)
        working-directory: reimpl
        run: |
          make CC="$CC" \
               CFLAGS="-Os -Wall -Wextra -static -I$GITHUB_WORKSPACE/libpcap-1.10.4" \
               LIBS="$GITHUB_WORKSPACE/libpcap-1.10.4/libpcap.a"
          mkdir -p ../dist
          cp x3c8021x-re ../dist/x3c8021x-re-openwrt-armv7
      - name: 校验
        run: |
          file dist/x3c8021x-re-openwrt-armv7
          ! readelf -d dist/x3c8021x-re-openwrt-armv7 | grep -q NEEDED
      - uses: actions/upload-artifact@v4
        with:
          name: x3c8021x-re-openwrt-armv7
          path: dist/x3c8021x-re-openwrt-armv7

  release:
    # 只有打标签才发布 Release; 手动触发时上面四个构建仍会产出 artifact
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows, build-macos, build-openwrt-armv7]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 汇总产物并生成校验和
        run: |
          mkdir -p dist
          cp artifacts/x3c8021x-re-linux-x86_64/x3c8021x-re-linux-x86_64 dist/
          cp artifacts/x3c8021x-re-win64/x3c8021x-re-win64.exe dist/
          cp artifacts/x3c8021x-re-macos-universal/x3c8021x-re-macos-universal dist/
          cp artifacts/x3c8021x-re-openwrt-armv7/x3c8021x-re-openwrt-armv7 dist/
          chmod +x dist/x3c8021x-re-linux-x86_64 dist/x3c8021x-re-macos-universal dist/x3c8021x-re-openwrt-armv7
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/x3c8021x-re-linux-x86_64
            dist/x3c8021x-re-win64.exe
            dist/x3c8021x-re-macos-universal
            dist/x3c8021x-re-openwrt-armv7
            dist/SHA256SUMS.txt
          generate_release_notes: true
          # 语义化版本预发行标识在 '-' 之后(rc/beta/alpha), 据此自动判定
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## 下载
            - `x3c8021x-re-linux-x86_64`：Linux x86_64（需系统已装 libpcap，如 `sudo apt install libpcap0.8`）
            - `x3c8021x-re-win64.exe`：Windows x64（需先安装 [Npcap](https://npcap.com) 并勾选 WinPcap API 兼容模式，以管理员身份运行）
            - `x3c8021x-re-macos-universal`：macOS Apple Silicon + Intel（首次运行若被拦截：`xattr -d com.apple.quarantine x3c8021x-re-macos-universal`）
            - `x3c8021x-re-openwrt-armv7`：OpenWrt ARMv7（musl 全静态，硬浮点 EABIhf；`scp` 到路由器后 `chmod +x` 直接运行，无需 opkg 装 libpcap）
            - `SHA256SUMS.txt`：各文件 SHA-256 校验和

            用法见 README。
